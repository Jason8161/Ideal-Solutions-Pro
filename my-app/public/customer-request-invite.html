<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Request service call</title>
    <!--
      Full customer request form — works in any phone/tablet browser (no app install).
      Deploy to HTTPS (GitHub Pages, Netlify, S3, etc.).
      Set EXPO_PUBLIC_CUSTOMER_REQUEST_URL in Ideal Solutions .env to this file's full URL.
      Query params (contractor): contractorEmail (required), contractorPhone, companyName
      Keep in sync with lib/customerServiceRequest.ts (mailto body + import link params).
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0b1f3a;
        color: #e8eeff;
      }
      body {
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 8px;
        line-height: 1.25;
      }
      .sub {
        font-size: 0.95rem;
        color: #94a8d6;
        line-height: 1.45;
        margin-bottom: 22px;
      }
      .err {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.45);
        color: #fecaca;
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .err[hidden] {
        display: none;
      }
      label {
        display: block;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #94a8d6;
        margin: 14px 0 6px;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        border-radius: 12px;
        border: 1px solid #3d5a8a;
        background: #102c55;
        color: #fff;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .urgency {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 8px 0 4px;
      }
      .urgency label {
        margin: 0;
        text-transform: none;
        font-size: 0.95rem;
        font-weight: 700;
        color: #e8eeff;
      }
      .urgency label span {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: #94a8d6;
        margin-top: 4px;
      }
      .chip {
        display: block;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #3d5a8a;
        background: #102c55;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .chip input {
        width: auto;
        margin-right: 10px;
        vertical-align: middle;
      }
      .chip.emergency-selected {
        border-color: #f59e0b;
        background: #3a2510;
      }
      .chip.scheduled-selected {
        border-color: #5b9bd4;
        background: #153a6b;
      }
      .btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 16px 18px;
        font-size: 1.05rem;
        font-weight: 800;
        color: #0b1f3a;
        background: #ff8c00;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        touch-action: manipulation;
        min-height: 52px;
      }
      .btn:active {
        opacity: 0.92;
      }
      .btn-secondary {
        background: #1e3a5f;
        color: #e8eeff;
        border: 1px solid #3d5a8a;
        margin-top: 12px;
      }
      .hint {
        font-size: 0.85rem;
        color: #94a8d6;
        margin-top: 14px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="err" id="pageErr" hidden></div>
      <div id="formWrap" hidden>
        <h1 id="title">Request a service call</h1>
        <p class="sub" id="companyLine"></p>
        <p class="sub" id="intro">
          Fill in your details below. When you send, your email or messages app will open — tap Send there to reach your
          contractor. No app install needed.
        </p>

        <div class="err" id="formErr" hidden role="alert"></div>

        <form id="f" novalidate>
          <label for="customerName">Your name</label>
          <input id="customerName" name="customerName" type="text" autocomplete="name" placeholder="Full name" />

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Best number to reach you" />

          <label for="custEmail">Email</label>
          <input id="custEmail" name="custEmail" type="email" autocomplete="email" placeholder="name@email.com" />

          <label for="address">Service address</label>
          <input id="address" name="address" type="text" autocomplete="street-address" placeholder="Street, city, or job site" />

          <label>How soon do you need help?</label>
          <div class="urgency">
            <label class="chip" id="chipSched">
              <input type="radio" name="urgency" value="scheduled" checked />
              Can be scheduled
              <span>Not urgent — a routine visit is fine</span>
            </label>
            <label class="chip" id="chipEmerg">
              <input type="radio" name="urgency" value="emergency" />
              Emergency
              <span>Needs prompt attention (safety, major leak, no heat, etc.)</span>
            </label>
          </div>

          <label for="problem">Describe the problem</label>
          <textarea id="problem" name="problem" placeholder="What needs service or repair?"></textarea>

          <label for="when">Preferred date / time (optional)</label>
          <input id="when" name="when" type="text" placeholder="e.g. Weekday mornings, or Sat after 2pm" />

          <button type="button" class="btn" id="btnEmail">Send request by email</button>
          <button type="button" class="btn btn-secondary" id="btnSms" hidden>Send request by text message</button>
        </form>

        <p class="hint" id="afterHint" hidden>
          Your mail or messages app should have opened. If nothing happened, check that an email or SMS app is set up
          on this device.
        </p>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var contractorEmail = (params.get("contractorEmail") || "").trim();
        var contractorPhone = (params.get("contractorPhone") || "").trim().replace(/[^\d+]/g, "");
        var companyName = (params.get("companyName") || "").trim();

        var pageErr = document.getElementById("pageErr");
        var formWrap = document.getElementById("formWrap");
        var companyLine = document.getElementById("companyLine");
        var formErr = document.getElementById("formErr");
        var chipSched = document.getElementById("chipSched");
        var chipEmerg = document.getElementById("chipEmerg");
        var btnSms = document.getElementById("btnSms");
        var afterHint = document.getElementById("afterHint");

        function urgencyLabel(u) {
          return u === "emergency"
            ? "Emergency — needs prompt attention"
            : "Can be scheduled — not urgent";
        }

        function workOrderNotes(payload) {
          var lines = ["Request type: " + urgencyLabel(payload.urgency)];
          if (payload.problem.trim()) lines.push("Problem: " + payload.problem.trim());
          if (payload.when.trim()) lines.push("Preferred date/time: " + payload.when.trim());
          lines.push("— Customer self-service request (web)");
          return lines.join("\n");
        }

        function buildImportLink(payload) {
          var notes = workOrderNotes(payload);
          var q = new URLSearchParams();
          q.set("fromCustomer", "1");
          if (payload.name.trim()) q.set("customerName", payload.name.trim());
          if (payload.phone.trim()) q.set("phoneMobile", payload.phone.trim());
          if (payload.email.trim()) q.set("email", payload.email.trim());
          if (payload.address.trim()) q.set("street", payload.address.trim());
          if (notes) q.set("workOrderNotes", notes);
          return "ideal-solutions://service-calls/new?" + q.toString();
        }

        function buildEmailBody(payload) {
          var importLink = buildImportLink(payload);
          var lines = [
            "New service call request from a customer:",
            "",
            "Name: " + (payload.name.trim() || "—"),
            "Phone: " + (payload.phone.trim() || "—"),
            "Email: " + (payload.email.trim() || "—"),
            "Service address: " + (payload.address.trim() || "—"),
            "Request type: " + urgencyLabel(payload.urgency),
            "Problem: " + (payload.problem.trim() || "—"),
            "Preferred date/time: " + (payload.when.trim() || "—"),
            "",
            "— Sent via Ideal Solutions customer request (web)",
            "",
            "Contractor: open this link on your phone in the Ideal Solutions app to pre-fill a new service call:",
            importLink,
          ];
          return lines.join("\n");
        }

        function readPayload() {
          var urgencyEl = document.querySelector('input[name="urgency"]:checked');
          return {
            name: document.getElementById("customerName").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("custEmail").value,
            address: document.getElementById("address").value,
            problem: document.getElementById("problem").value,
            when: document.getElementById("when").value,
            urgency: urgencyEl ? urgencyEl.value : "scheduled",
          };
        }

        function validate(p) {
          if (p.urgency !== "emergency" && p.urgency !== "scheduled") return "Choose whether this is an emergency or can be scheduled.";
          var hasName = p.name.trim().length > 0;
          var hasPhone = p.phone.trim().length > 0;
          var hasEmail = p.email.trim().length > 0;
          if (!hasName && !hasPhone && !hasEmail) return "Enter at least your name, phone, or email.";
          if (!p.problem.trim()) return "Describe the problem or service needed.";
          return null;
        }

        function syncChipStyles() {
          var u = readPayload().urgency;
          chipSched.classList.toggle("scheduled-selected", u === "scheduled");
          chipEmerg.classList.toggle("emergency-selected", u === "emergency");
        }

        document.querySelectorAll('input[name="urgency"]').forEach(function (el) {
          el.addEventListener("change", syncChipStyles);
        });
        syncChipStyles();

        if (!contractorEmail) {
          pageErr.textContent =
            "This invite link is missing information. Ask your contractor to send a new link from their Ideal Solutions app.";
          pageErr.hidden = false;
          return;
        }

        formWrap.hidden = false;
        if (companyName) {
          companyLine.textContent = companyName;
        } else {
          companyLine.style.display = "none";
        }

        if (contractorPhone) {
          btnSms.hidden = false;
        }

        function showFormErr(msg) {
          formErr.textContent = msg;
          formErr.hidden = false;
        }
        function clearFormErr() {
          formErr.hidden = true;
          formErr.textContent = "";
        }

        document.getElementById("btnEmail").addEventListener("click", function () {
          clearFormErr();
          var p = readPayload();
          var err = validate(p);
          if (err) {
            showFormErr(err);
            return;
          }
          var subj =
            (p.urgency === "emergency" ? "[EMERGENCY] " : "") +
            "Service call request — " +
            (p.name.trim() || "Customer");
          var body = buildEmailBody(p);
          var mail =
            "mailto:" +
            encodeURIComponent(contractorEmail) +
            "?subject=" +
            encodeURIComponent(subj) +
            "&body=" +
            encodeURIComponent(body);
          if (mail.length > 65000) {
            showFormErr("Request is too long for email. Shorten the description and try again.");
            return;
          }
          window.location.href = mail;
          afterHint.hidden = false;
        });

        document.getElementById("btnSms").addEventListener("click", function () {
          clearFormErr();
          var p = readPayload();
          var err = validate(p);
          if (err) {
            showFormErr(err);
            return;
          }
          if (!contractorPhone) {
            showFormErr("No contractor phone was included in this link. Use email instead.");
            return;
          }
          var smsBody = [
            "Service call request:",
            p.urgency === "emergency" ? "EMERGENCY — needs prompt attention" : "Can be scheduled (not urgent)",
            p.name.trim() && "Name: " + p.name.trim(),
            p.phone.trim() && "Phone: " + p.phone.trim(),
            p.problem.trim() && "Problem: " + p.problem.trim(),
            p.when.trim() && "When: " + p.when.trim(),
          ]
            .filter(Boolean)
            .join("\n");
          var smsUrl = "sms:" + contractorPhone + "?body=" + encodeURIComponent(smsBody);
          window.location.href = smsUrl;
          afterHint.hidden = false;
        });
      })();
    </script>
  </body>
</html>
