<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>PAY NOW — Invoice payment</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0b1f3a;
        color: #e8eeff;
      }
      body {
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main { width: 100%; max-width: 560px; margin: 0 auto; }
      .pay-now {
        font-size: 2rem;
        font-weight: 900;
        color: #22c55e;
        letter-spacing: 0.06em;
        text-align: center;
        margin: 8px 0 4px;
      }
      .sub { text-align: center; color: #94a8d6; margin: 0 0 20px; }
      .summary {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        margin-bottom: 20px;
      }
      .company { font-weight: 800; margin-bottom: 8px; }
      .label {
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a8d6;
        margin-top: 10px;
      }
      .amount { font-size: 1.75rem; font-weight: 900; color: #22c55e; }
      .methods { display: grid; gap: 10px; }
      .method {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }
      .method:hover {
        background: rgba(34, 197, 94, 0.12);
        border-color: rgba(34, 197, 94, 0.45);
      }
      .method-name { font-weight: 800; }
      .method-hint {
        font-size: 0.78rem;
        color: #94a8d6;
        margin-top: 4px;
        word-break: break-all;
      }
      .chev { font-size: 1.4rem; opacity: 0.6; }
      .empty, .err { border-radius: 12px; padding: 14px; line-height: 1.45; }
      .empty {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .err {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.45);
        color: #fecaca;
      }
      .footer {
        margin-top: 24px;
        font-size: 0.78rem;
        line-height: 1.45;
        color: #94a8d6;
        text-align: center;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="pay-now">PAY NOW</h1>
      <p class="sub">Choose how you would like to pay</p>
      <div id="err" class="err" hidden></div>
      <div id="summary" class="summary" hidden>
        <div id="company" class="company"></div>
        <div class="label">Invoice</div>
        <div id="invoiceRef"></div>
        <div class="label">Balance due</div>
        <div id="amount" class="amount"></div>
      </div>
      <div id="methods" class="methods"></div>
      <p class="footer">
        Payments go directly to your contractor. Ideal Solutions does not process card or bank payments.
      </p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var invoice = params.get("invoice") || params.get("invoice_id") || "—";
        var amountMajor = params.get("amount") || "";
        var amountCents = params.get("amount_cents") || "";
        var company = params.get("company") || "";
        var encoded = params.get("m") || "";

        var errEl = document.getElementById("err");
        var summaryEl = document.getElementById("summary");
        var companyEl = document.getElementById("company");
        var invoiceRefEl = document.getElementById("invoiceRef");
        var amountEl = document.getElementById("amount");
        var methodsEl = document.getElementById("methods");

        function formatMoney(cents, major) {
          var c = Number.parseInt(cents, 10);
          if (Number.isFinite(c) && c >= 0) {
            return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(c / 100);
          }
          var m = Number.parseFloat(major);
          if (Number.isFinite(m) && m >= 0) {
            return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(m);
          }
          return "—";
        }

        function decodeMethods(encodedValue) {
          if (!encodedValue) return [];
          try {
            var padded = encodedValue.replace(/-/g, "+").replace(/_/g, "/");
            var pad = padded.length % 4 === 0 ? "" : "=".repeat(4 - (padded.length % 4));
            var json = atob(padded + pad);
            var parsed = JSON.parse(json);
            return Array.isArray(parsed) ? parsed : [];
          } catch (e) {
            return [];
          }
        }

        function appendInvoiceQuery(url, invoiceRef, amount) {
          try {
            var u = new URL(url, window.location.origin);
            if (invoiceRef) u.searchParams.set("invoice", invoiceRef);
            if (amount) u.searchParams.set("amount", amount);
            return u.toString();
          } catch (e) {
            return url;
          }
        }

        var methods = decodeMethods(encoded);
        summaryEl.hidden = false;
        if (company) {
          companyEl.textContent = company;
        } else {
          companyEl.hidden = true;
        }
        invoiceRefEl.textContent = invoice;
        amountEl.textContent = formatMoney(amountCents, amountMajor);

        if (methods.length === 0) {
          methodsEl.innerHTML =
            '<div class="empty">No payment methods were included in this link. Ask your contractor to resend the invoice after configuring payment methods.</div>';
          return;
        }

        methods.forEach(function (row) {
          var btn = document.createElement("a");
          btn.className = "method";
          btn.rel = "noopener noreferrer";
          var name = (row.n || row.name || "Pay").trim();
          var url = (row.u || row.url || "").trim();
          btn.innerHTML =
            '<div><div class="method-name">' + name + '</div><div class="method-hint">' +
            (url || "Open app or website") +
            '</div></div><span class="chev">›</span>';
          if (url) {
            btn.href = appendInvoiceQuery(url, invoice, amountMajor);
            btn.target = "_blank";
          } else {
            btn.href = "#";
            btn.addEventListener("click", function (e) {
              e.preventDefault();
              errEl.hidden = false;
              errEl.textContent = "No payment URL saved for " + name + ". Contact your contractor.";
            });
          }
          methodsEl.appendChild(btn);
        });
      })();
    </script>
  </body>
</html>
